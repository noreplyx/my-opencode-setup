<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-label="Monthly pipeline: request to drafts to canvas overview to ADR accepted">
  <style>
    .box { fill: #1e1e2e; stroke: #89b4fa; stroke-width: 2; rx: 8; }
    .lbl { fill: #cdd6f4; font-family: monospace; font-size: 13px; text-anchor: middle; }
    .sub { fill: #a6adc8; font-family: monospace; font-size: 11px; text-anchor: middle; }
    .arr { stroke: #89b4fa; stroke-width: 2; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#89b4fa" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect class="box" x="10" y="70" width="140" height="80" rx="8"/>
  <text class="lbl" x="80" y="105">Request</text>
  <text class="sub" x="80" y="125">plan / decision</text>
  <rect class="box" x="180" y="70" width="140" height="80" rx="8"/>
  <text class="lbl" x="250" y="105">Drafts</text>
  <text class="sub" x="250" y="125">Stage 3 + Stage 4</text>
  <rect class="box" x="350" y="70" width="140" height="80" rx="8"/>
  <text class="lbl" x="420" y="105">Canvas</text>
  <text class="sub" x="420" y="125">overview</text>
  <rect class="box" x="510" y="70" width="120" height="80" rx="8"/>
  <text class="lbl" x="570" y="105">ADR-002</text>
  <text class="sub" x="570" y="125">accepted</text>
  <line class="arr" x1="150" y1="110" x2="178" y2="110"/>
  <line class="arr" x1="320" y1="110" x2="348" y2="110"/>
  <line class="arr" x1="490" y1="110" x2="508" y2="110"/>
  <text class="sub" x="320" y="30">assets/*.svg sidecars embedded by notes</text>
  <text class="sub" x="320" y="190">Text fallback: request -&gt; drafts -&gt; canvas overview -&gt; ADR accepted</text>
</svg>
